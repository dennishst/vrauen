<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmeldung bestätigt — VRauen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#143F64;
    --pink-card:#FCE5EE;
    --white:#FFFFFF;
    --green:#2E8B57;
    --red:#B3324A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Nunito',-apple-system,sans-serif;background:var(--pink-card);color:var(--navy);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .box{
    background:var(--white);border-radius:22px;padding:44px 36px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 20px 44px -26px rgba(20,63,100,0.45);
  }
  .icon{font-size:40px;margin-bottom:8px;}
  h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:23px;margin-bottom:14px;}
  p{line-height:1.6;font-size:15px;opacity:0.9;margin-bottom:24px;}
  a.btn{
    display:inline-block;background:var(--navy);color:var(--white);text-decoration:none;
    padding:13px 28px;border-radius:999px;font-weight:800;font-size:14.5px;
  }
  a.btn:hover{opacity:0.9;}
  .icon.error{color:var(--red);}
  .icon.success{color:var(--green);}
</style>
</head>
<body>
  <div class="box">
    <div class="icon" id="icon">✓</div>
    <h1 id="title">Anmeldung bestätigt!</h1>
    <p id="message">Danke, deine Anmeldung zum VRauen Newsletter ist jetzt bestätigt. Wir freuen uns, dich auf dem Laufenden zu halten.</p>
    <a href="/" class="btn">Zurück zur Website</a>
  </div>

  <script>
    // Zeigt eine andere Meldung, falls die Edge Function mit ?status=error weiterleitet
    // (z.B. Link ungültig oder abgelaufen).
    const params = new URLSearchParams(window.location.search);
    if (params.get('status') === 'error') {
      document.getElementById('icon').textContent = '✕';
      document.getElementById('icon').classList.add('error');
      document.getElementById('title').textContent = 'Link ungültig oder abgelaufen';
      document.getElementById('message').textContent = 'Diese Bestätigung konnte nicht zugeordnet werden. Vielleicht bist du schon angemeldet? Bei Fragen schreib uns gern.';
    } else {
      document.getElementById('icon').classList.add('success');
    }
  </script>
</body>
</html>
