<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dein Ticket — VRauen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
  const SUPABASE_URL = 'https://zdndcmxxcxvjloftohhg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jqU_8wVSce7-uBO1s5oETA__xf2Z0R_';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<style>
  :root{
    --navy:#143F64; --navy-soft:#2C567E; --pink:#F9CBDD; --pink-card:#FCE5EE; --pink-deep:#F3A9C4; --white:#FFFFFF;
    --r-xs:10px; --r-sm:16px; --r-md:22px; --r-lg:30px; --r-pill:999px;
    --display:"Baloo 2","Nunito",sans-serif; --body:"Nunito",-apple-system,sans-serif; --maxw:520px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--body);background:var(--pink-card);color:var(--navy);line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
  h1,h2{font-family:var(--display);font-weight:800;color:var(--navy);}

  header{padding:22px 0;text-align:center;}
  .logo{font-family:var(--display);font-weight:800;font-size:19px;color:var(--navy);text-decoration:none;}

  .ticket-card{background:var(--white);border-radius:var(--r-lg);padding:32px;text-align:center;box-shadow:0 20px 50px -28px rgba(20,63,100,0.35);margin-bottom:40px;}
  .ticket-card h2{font-size:20px;margin-bottom:4px;}
  .ticket-meta{font-size:13.5px;opacity:0.75;margin-bottom:22px;}
  .ticket-card img{width:220px;height:220px;border-radius:12px;margin-bottom:18px;}
  .qr-download-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .qr-download-row button{
    font-family:var(--body);font-size:12.5px;font-weight:800;color:var(--navy);
    background:var(--white);border:1.5px solid rgba(20,63,100,0.25);border-radius:var(--r-pill);
    padding:9px 16px;cursor:pointer;
  }
  .qr-download-row button:hover{border-color:var(--navy);}
  .qr-download-row button:disabled{opacity:0.5;cursor:not-allowed;}
  .checked-badge{
    display:inline-block;margin-top:16px;font-size:12px;font-weight:800;color:#1F6B36;
    background:#DFF3E4;padding:6px 14px;border-radius:var(--r-pill);
  }
  .notfound{max-width:480px;margin:80px auto;text-align:center;padding:0 24px;}
  .notfound h1{font-size:22px;margin-bottom:12px;}
  .notfound a{color:var(--navy);font-weight:800;}
</style>
</head>
<body>

  <header><a href="/" class="logo">VRauen</a></header>

  <main class="wrap" id="ticketContent">
    <div style="text-align:center;padding:80px 0;opacity:0.5;">Lädt…</div>
  </main>

<script>
  function escapeHTML(str){
    if(!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function fmtDatum(d, z){
    if(!d) return '';
    const [y,m,day] = d.split('-');
    return `${day}.${m}.${y}` + (z ? ' · ' + z.slice(0,5) + ' Uhr' : '');
  }

  async function loadTicket(){
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const content = document.getElementById('ticketContent');

    if (!token){ content.innerHTML = notFoundHTML(); return; }

    const { data: reg, error } = await sb
      .from('event_registrations')
      .select('*, events(name, datum, zeit, ort)')
      .eq('checkin_token', token)
      .maybeSingle();

    if (error || !reg || !reg.events){ content.innerHTML = notFoundHTML(); return; }

    const ev = reg.events;
    const qrDataUrl = await QRCode.toDataURL(token, { width: 400, margin: 1 });

    content.innerHTML = `
      <div class="ticket-card">
        <h2>${escapeHTML(ev.name)}</h2>
        <div class="ticket-meta">${fmtDatum(ev.datum, ev.zeit)}${ev.ort ? ' · ' + escapeHTML(ev.ort) : ''}</div>
        <img src="${qrDataUrl}" alt="QR-Code">
        <div class="qr-download-row">
          <button type="button" id="dlImgBtn">Als Bild speichern</button>
          <button type="button" id="dlPdfBtn">Als PDF speichern</button>
        </div>
        ${reg.checked_in ? `<div class="checked-badge">✓ Bereits eingecheckt</div>` : ''}
      </div>`;

    document.getElementById('dlImgBtn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = qrDataUrl;
      a.download = `VRauen-QR-${ev.name.replace(/[^a-z0-9]+/gi,'-')}.png`;
      a.click();
    });

    document.getElementById('dlPdfBtn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = 'Erstelle PDF…';
      try {
        await downloadTicketPDF({
          eventName: ev.name, eventDatum: fmtDatum(ev.datum).split(' · ')[0] || fmtDatum(ev.datum),
          eventZeit: ev.zeit ? ev.zeit.slice(0,5) : null,
          eventOrt: ev.ort || null, vorname: reg.vorname, qrDataUrl
        });
      } finally {
        btn.disabled = false;
        btn.textContent = 'Als PDF speichern';
      }
    });
  }

  async function downloadTicketPDF({ eventName, eventDatum, eventZeit, eventOrt, vorname, qrDataUrl }){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageWidth = doc.internal.pageSize.getWidth();

    doc.setFillColor(20, 63, 100);
    doc.rect(0, 0, pageWidth, 38, 'F');
    doc.setTextColor(249, 203, 221);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(22);
    doc.text('VRauen', pageWidth / 2, 20, { align: 'center' });
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.text('EVENT-TICKET', pageWidth / 2, 28, { align: 'center' });

    doc.setTextColor(20, 63, 100);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.text(eventName, pageWidth / 2, 55, { align: 'center', maxWidth: pageWidth - 40 });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(12);
    let infoLine = eventDatum + (eventZeit ? ' · ' + eventZeit + ' Uhr' : '');
    doc.text(infoLine, pageWidth / 2, 65, { align: 'center' });
    if (eventOrt){
      doc.text(eventOrt, pageWidth / 2, 72, { align: 'center' });
    }
    if (vorname){
      doc.setFontSize(11);
      doc.setTextColor(90, 90, 90);
      doc.text('Angemeldet: ' + vorname, pageWidth / 2, 80, { align: 'center' });
    }

    const qrSize = 80;
    doc.addImage(qrDataUrl, 'PNG', (pageWidth - qrSize) / 2, 92, qrSize, qrSize);

    doc.setFontSize(10);
    doc.setTextColor(120, 120, 120);
    doc.text('Diesen QR-Code beim Einlass vorzeigen.', pageWidth / 2, 182, { align: 'center' });

    doc.save('VRauen-Ticket-' + eventName.replace(/[^a-z0-9]+/gi, '-') + '.pdf');
  }

  function notFoundHTML(){
    return `
      <div class="notfound">
        <h1>Ticket nicht gefunden</h1>
        <p style="opacity:0.75;margin-bottom:20px;">Dieser Link ist ungültig oder abgelaufen.</p>
        <a href="/">Zurück zur Website</a>
      </div>`;
  }

  loadTicket();
</script>

</body>
</html>
