<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abgemeldet — VRauen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#143F64; --pink-card:#FCE5EE; --white:#FFFFFF; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Nunito',-apple-system,sans-serif;background:var(--pink-card);color:var(--navy);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .box{
    background:var(--white);border-radius:22px;padding:44px 36px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 20px 44px -26px rgba(20,63,100,0.45);
  }
  .icon{font-size:40px;margin-bottom:8px;}
  h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:23px;margin-bottom:14px;}
  p{line-height:1.6;font-size:15px;opacity:0.9;margin-bottom:24px;}
  a.btn{
    display:inline-block;background:var(--navy);color:var(--white);text-decoration:none;
    padding:13px 28px;border-radius:999px;font-weight:800;font-size:14.5px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">👋</div>
    <h1>Du bist abgemeldet</h1>
    <p>Schade, dass du gehst! Deine E-Mail-Adresse wurde aus unserem Newsletter-Verteiler entfernt. Du kannst dich jederzeit wieder anmelden.</p>
    <a href="/" class="btn">Zurück zur Website</a>
  </div>
</body>
</html>
