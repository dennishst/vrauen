<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRauen — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ====== SUPABASE KONFIGURATION ======
     Gleiche Werte wie in index.html eintragen:
     Project Settings -> API -> "Project URL" und "anon public" Key. */
  const SUPABASE_URL = 'https://DEIN-PROJEKT.supabase.co';
  const SUPABASE_ANON_KEY = 'DEIN-ANON-KEY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<style>
  :root{
    --navy:#143F64;
    --navy-soft:#2C567E;
    --pink:#F9CBDD;
    --pink-card:#FCE5EE;
    --pink-deep:#F3A9C4;
    --white:#FFFFFF;
    --green:#2E8B57;
    --red:#B3324A;
    --display:"Baloo 2","Nunito",sans-serif;
    --body:"Nunito",-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:var(--body);background:var(--pink-card);color:var(--navy);
    min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--display);font-weight:800;}
  a{color:inherit;}

  /* ---------- Login-Screen ---------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-box{
    background:var(--white);border-radius:22px;padding:40px 36px;max-width:380px;width:100%;
    box-shadow:0 20px 44px -26px rgba(20,63,100,0.45);
  }
  .login-box h1{font-size:24px;margin-bottom:6px;}
  .login-box p.sub{font-size:14px;opacity:0.7;margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #E3E3E3;
    font-family:var(--body);font-size:14.5px;
  }
  .field input:focus{outline:none;border-color:var(--navy);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    font-family:var(--body);font-weight:800;font-size:14.5px;padding:14px;border-radius:999px;
    border:none;cursor:pointer;background:var(--navy);color:var(--white);transition:opacity .2s ease;
  }
  .btn:hover{opacity:0.9;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .login-error{color:var(--red);font-size:13px;margin-top:14px;display:none;}

  /* ---------- Dashboard ---------- */
  #dashboard{display:none;}
  header.admin-header{
    background:var(--navy);color:var(--white);padding:18px 28px;
    display:flex;align-items:center;justify-content:space-between;
  }
  header.admin-header h1{font-size:20px;color:var(--white);}
  header.admin-header .who{font-size:13px;opacity:0.8;}
  .btn-outline{
    background:transparent;border:1.5px solid rgba(255,255,255,0.4);color:var(--white);
    padding:9px 18px;border-radius:999px;font-family:var(--body);font-weight:700;font-size:13px;
    cursor:pointer;width:auto;
  }
  .btn-outline:hover{background:rgba(255,255,255,0.12);}

  main{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}
  .tabs{display:flex;gap:8px;margin-bottom:24px;background:var(--white);padding:6px;border-radius:999px;width:fit-content;}
  .tab-btn{
    padding:10px 22px;border-radius:999px;border:none;background:transparent;color:var(--navy);
    font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer;
  }
  .tab-btn.active{background:var(--navy);color:var(--white);}

  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--white);border-radius:18px;padding:6px;overflow-x:auto;box-shadow:0 12px 30px -22px rgba(20,63,100,0.35);}
  table{width:100%;border-collapse:collapse;min-width:600px;}
  th{
    text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:0.03em;
    color:var(--navy);opacity:0.6;padding:14px 16px;border-bottom:2px solid var(--pink-card);
  }
  td{padding:14px 16px;font-size:14px;border-bottom:1px solid #F2F2F2;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .badge{
    display:inline-block;padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:800;
  }
  .badge.bestaetigt{background:#E3F4EA;color:var(--green);}
  .badge.unbestaetigt{background:#FDF3E3;color:#B3821E;}
  .badge.abgemeldet{background:#F2F2F2;color:#888;}
  .badge.unread{background:var(--pink-card);color:var(--navy);}
  .badge.read{background:#F2F2F2;color:#888;}
  .mark-btn{
    border:1.5px solid var(--navy);background:transparent;color:var(--navy);
    padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--body);
  }
  .mark-btn:hover{background:var(--navy);color:var(--white);}
  .empty-state{padding:60px 20px;text-align:center;opacity:0.6;font-size:14px;}
  .loading{padding:40px;text-align:center;opacity:0.6;font-size:14px;}
  .count-pill{
    display:inline-block;background:var(--pink);color:var(--navy);font-size:12px;font-weight:800;
    padding:2px 10px;border-radius:999px;margin-left:8px;
  }
  .msg-cell{max-width:320px;white-space:pre-wrap;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
  .refresh-btn{
    background:var(--white);border:1.5px solid var(--navy);color:var(--navy);
    padding:9px 18px;border-radius:999px;font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer;width:auto;
  }
  .refresh-btn:hover{background:var(--navy);color:var(--white);}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen">
  <div class="login-box">
    <h1>VRauen Admin</h1>
    <p class="sub">Nur für Teammitglieder mit Zugang.</p>
    <form id="loginForm">
      <div class="field">
        <label for="li-email">E-Mail</label>
        <input type="email" id="li-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="li-pass">Passwort</label>
        <input type="password" id="li-pass" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Anmelden</button>
      <p class="login-error" id="loginError">E-Mail oder Passwort falsch.</p>
    </form>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard">
  <header class="admin-header">
    <h1>VRauen — Übersicht</h1>
    <div style="display:flex;align-items:center;gap:16px;">
      <span class="who" id="whoLabel"></span>
      <button class="btn-outline" id="logoutBtn">Abmelden</button>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="subscribers">Newsletter <span class="count-pill" id="countSubs">0</span></button>
      <button class="tab-btn" data-tab="submissions">Einreichungen <span class="count-pill" id="countSubm">0</span></button>
    </div>

    <div class="panel active" id="panel-subscribers">
      <div class="toolbar">
        <div></div>
        <button class="refresh-btn" onclick="loadSubscribers()">Aktualisieren</button>
      </div>
      <div class="card">
        <div id="subscribersContent" class="loading">Lädt…</div>
      </div>
    </div>

    <div class="panel" id="panel-submissions">
      <div class="toolbar">
        <div></div>
        <button class="refresh-btn" onclick="loadSubmissions()">Aktualisieren</button>
      </div>
      <div class="card">
        <div id="submissionsContent" class="loading">Lädt…</div>
      </div>
    </div>
  </main>
</div>

<script>
  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const whoLabel = document.getElementById('whoLabel');

  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' +
           d.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
  }
  function escapeHTML(str){
    if(!str) return '';
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* ---------- Auth ---------- */
  async function checkSession(){
    const { data:{ session } } = await sb.auth.getSession();
    if (session){
      showDashboard(session.user.email);
    } else {
      loginScreen.style.display = 'flex';
      dashboard.style.display = 'none';
    }
  }

  function showDashboard(email){
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    whoLabel.textContent = email;
    loadSubscribers();
    loadSubmissions();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-pass').value;
    loginBtn.disabled = true;
    loginError.style.display = 'none';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    loginBtn.disabled = false;
    if (error){
      loginError.style.display = 'block';
      return;
    }
    showDashboard(data.user.email);
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });

  /* ---------- Tabs ---------- */
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  /* ---------- Subscribers laden ---------- */
  async function loadSubscribers(){
    const el = document.getElementById('subscribersContent');
    el.className = 'loading';
    el.textContent = 'Lädt…';
    const { data, error } = await sb.from('subscribers').select('*').order('created_at', { ascending: false });
    if (error){
      el.textContent = 'Fehler beim Laden: ' + error.message;
      return;
    }
    document.getElementById('countSubs').textContent = data.length;
    if (data.length === 0){
      el.className = 'empty-state';
      el.textContent = 'Noch keine Anmeldungen.';
      return;
    }
    el.className = '';
    el.innerHTML = `
      <table>
        <thead><tr><th>E-Mail</th><th>Quelle</th><th>Status</th><th>Angemeldet am</th></tr></thead>
        <tbody>
          ${data.map(row => `
            <tr>
              <td>${escapeHTML(row.email)}</td>
              <td>${escapeHTML(row.source || '—')}</td>
              <td><span class="badge ${row.status}">${row.status}</span></td>
              <td>${fmtDate(row.created_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  /* ---------- Submissions laden ---------- */
  async function loadSubmissions(){
    const el = document.getElementById('submissionsContent');
    el.className = 'loading';
    el.textContent = 'Lädt…';
    const { data, error } = await sb.from('form_submissions').select('*').order('created_at', { ascending: false });
    if (error){
      el.textContent = 'Fehler beim Laden: ' + error.message;
      return;
    }
    document.getElementById('countSubm').textContent = data.length;
    if (data.length === 0){
      el.className = 'empty-state';
      el.textContent = 'Noch keine Einreichungen.';
      return;
    }
    el.className = '';
    el.innerHTML = `
      <table>
        <thead><tr><th>Typ</th><th>Name</th><th>E-Mail</th><th>Nachricht</th><th>Datum</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${data.map(row => `
            <tr>
              <td>${escapeHTML(row.type)}</td>
              <td>${escapeHTML(row.name || '—')}</td>
              <td>${escapeHTML(row.email || '—')}</td>
              <td class="msg-cell">${escapeHTML(row.message || '—')}</td>
              <td>${fmtDate(row.created_at)}</td>
              <td><span class="badge ${row.read ? 'read' : 'unread'}">${row.read ? 'gelesen' : 'neu'}</span></td>
              <td>${row.read ? '' : `<button class="mark-btn" onclick="markRead('${row.id}')">Als gelesen markieren</button>`}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  async function markRead(id){
    const { error } = await sb.from('form_submissions').update({ read: true }).eq('id', id);
    if (!error) loadSubmissions();
  }

  checkSession();
</script>

</body>
</html>
